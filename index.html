<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPay AI Voice Screener</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      min-height:100vh; color:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .screen{ display:none; width:100%; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .screen.active{ display:flex; }

    /* ── Name Screen ── */
    .card{
      background:rgba(255,255,255,0.06); backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12); border-radius:28px;
      padding:52px 44px; max-width:500px; width:100%;
      text-align:center; box-shadow:0 30px 80px rgba(0,0,0,0.5);
    }
    .big-icon{ font-size:72px; margin-bottom:18px; }
    h1{ font-size:28px; font-weight:800; margin-bottom:8px; }
    .sub{ font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:36px; line-height:1.6; }
    input.field{
      width:100%; padding:15px 20px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.08);
      color:#fff; font-size:15px; outline:none; margin-bottom:14px;
    }
    input.field::placeholder{ color:rgba(255,255,255,0.3); }
    input.field:focus{ border-color:#818cf8; }
    .btn-primary{
      width:100%; padding:15px; border-radius:14px; border:none;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff; font-size:16px; font-weight:700; cursor:pointer;
      transition:opacity .2s,transform .2s;
    }
    .btn-primary:hover:not(:disabled){ opacity:.9; transform:translateY(-2px); }
    .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }

    /* ── Voice Screen ── */
    .voice-wrap{
      max-width:640px; width:100%;
      display:flex; flex-direction:column; align-items:center; gap:28px;
    }
    .progress-bar-wrap{ width:100%; background:rgba(255,255,255,0.08); border-radius:99px; height:6px; }
    .progress-bar{ height:6px; border-radius:99px; background:linear-gradient(90deg,#6366f1,#8b5cf6); transition:width .5s; }
    .q-card{
      background:rgba(255,255,255,0.07); backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.12); border-radius:24px;
      padding:36px 32px; width:100%; text-align:center;
    }
    .q-num{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:14px; }
    .q-text{ font-size:18px; font-weight:600; line-height:1.6; color:#e2e8f0; min-height:56px; }
    .status-badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 20px; border-radius:99px; font-size:13px; font-weight:600;
      margin-top:18px;
    }
    .badge-speaking{ background:rgba(99,102,241,0.25); border:1px solid rgba(99,102,241,0.5); color:#a5b4fc; }
    .badge-listening{ background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.5); color:#fca5a5; }
    .badge-thinking{ background:rgba(251,191,36,0.15); border:1px solid rgba(251,191,36,0.4); color:#fde68a; }
    .badge-correct{ background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#86efac; }
    .badge-wrong{ background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; }
    .badge-idle{ background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.5); }

    /* AI avatar orb */
    .orb-wrap{ position:relative; width:160px; height:160px; }
    .orb{
      width:160px; height:160px; border-radius:50%;
      background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
      display:flex; align-items:center; justify-content:center;
      font-size:64px;
      box-shadow:0 0 40px rgba(99,102,241,0.5);
      transition:transform .3s;
      position:relative; z-index:2;
    }
    .orb.speaking{ animation:orbPulse 0.6s ease-in-out infinite alternate; }
    .orb.listening{ animation:orbListen 1s ease-in-out infinite; }
    @keyframes orbPulse{
      from{ transform:scale(1); box-shadow:0 0 40px rgba(99,102,241,0.5); }
      to  { transform:scale(1.08); box-shadow:0 0 70px rgba(139,92,246,0.8); }
    }
    @keyframes orbListen{
      0%,100%{ transform:scale(1); box-shadow:0 0 40px rgba(239,68,68,0.4); }
      50%    { transform:scale(1.05); box-shadow:0 0 60px rgba(239,68,68,0.7); }
    }
    .ring{
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:180px; height:180px; border-radius:50%;
      border:2px solid rgba(99,102,241,0.3);
      animation:ringPulse 2s ease-out infinite;
    }
    .ring2{ animation-delay:.6s; border-color:rgba(139,92,246,0.2); }
    @keyframes ringPulse{
      0%  { transform:translate(-50%,-50%) scale(1); opacity:1; }
      100%{ transform:translate(-50%,-50%) scale(1.6); opacity:0; }
    }

    /* Transcript */
    .transcript-box{
      width:100%; background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1); border-radius:14px;
      padding:14px 18px; min-height:52px;
      font-size:14px; color:rgba(255,255,255,0.7); line-height:1.6;
      text-align:center; font-style:italic;
    }
    .transcript-box.has-text{ color:#e2e8f0; font-style:normal; }

    /* Mic button */
    .mic-btn{
      width:72px; height:72px; border-radius:50%; border:none; cursor:pointer;
      background:linear-gradient(135deg,#ef4444,#dc2626);
      font-size:28px; display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 24px rgba(239,68,68,0.4);
      transition:transform .2s, opacity .2s;
    }
    .mic-btn:hover:not(:disabled){ transform:scale(1.1); }
    .mic-btn:disabled{ opacity:.35; cursor:not-allowed; }
    .mic-btn.active{ animation:micPulse .8s ease-in-out infinite alternate; background:linear-gradient(135deg,#ef4444,#b91c1c); }
    @keyframes micPulse{
      from{ box-shadow:0 8px 24px rgba(239,68,68,0.4); transform:scale(1); }
      to  { box-shadow:0 8px 48px rgba(239,68,68,0.8); transform:scale(1.1); }
    }
    .mic-label{ font-size:12px; color:rgba(255,255,255,0.45); margin-top:6px; }

    /* Result Screen */
    .result-card{
      background:rgba(255,255,255,0.06); backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12); border-radius:28px;
      padding:52px 44px; max-width:520px; width:100%;
      text-align:center; box-shadow:0 30px 80px rgba(0,0,0,0.5);
    }
    .result-icon{ font-size:72px; margin-bottom:16px; }
    .pass-title{ font-size:30px; font-weight:800; color:#22c55e; margin-bottom:8px; }
    .fail-title{ font-size:30px; font-weight:800; color:#ef4444; margin-bottom:8px; }
    .score-text{ font-size:15px; color:rgba(255,255,255,0.6); margin-bottom:28px; }
    .q-results{ display:flex; flex-direction:column; gap:10px; margin-bottom:32px; text-align:left; }
    .q-result-row{
      display:flex; align-items:flex-start; gap:12px; padding:12px 16px;
      border-radius:12px; font-size:13px; line-height:1.5;
    }
    .q-result-row.ok { background:rgba(34,197,94,0.1);  border:1px solid rgba(34,197,94,0.25); }
    .q-result-row.bad{ background:rgba(239,68,68,0.1);  border:1px solid rgba(239,68,68,0.25); }
    .q-result-row .heard{ color:rgba(255,255,255,0.45); font-size:12px; margin-top:2px; }
    .btn-green{
      width:100%; padding:16px; border-radius:14px; border:none;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff; font-size:16px; font-weight:700; cursor:pointer;
      transition:opacity .2s,transform .2s;
    }
    .btn-green:hover{ opacity:.9; transform:translateY(-2px); }
    .btn-retry{
      width:100%; padding:16px; border-radius:14px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.07);
      color:#fff; font-size:16px; font-weight:600; cursor:pointer;
      transition:opacity .2s;
    }
    .btn-retry:hover{ opacity:.75; }
    .warn{ font-size:12px; color:rgba(255,255,255,0.35); margin-top:18px; }
  </style>
</head>
<body>

<!-- SCREEN 1: Name -->
<div class="screen active" id="s-name">
  <div class="card">
    <div class="big-icon">🤖</div>
    <h1>XPay AI Voice Screener</h1>
    <p class="sub">The AI will <strong>speak questions</strong> to you.<br>You <strong>answer by voice</strong>. Pass to enter the exam.</p>
    <input class="field" id="nameField" placeholder="Enter your full name..." autocomplete="off" />
    <button class="btn-primary" id="startBtn" disabled>Start Voice Screening 🎤</button>
    <p class="warn" style="margin-top:16px">⚠️ Use Chrome browser &amp; allow Microphone when asked</p>
  </div>
</div>

<!-- SCREEN 2: Voice Chat -->
<div class="screen" id="s-voice">
  <div class="voice-wrap">

    <!-- Progress -->
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:rgba(255,255,255,0.5)" id="progressLabel">Question 1 of 3</span>
      <span style="font-size:13px;color:rgba(255,255,255,0.5)" id="nameLabel"></span>
    </div>
    <div class="progress-bar-wrap" style="margin-top:-16px">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>

    <!-- AI Orb -->
    <div class="orb-wrap">
      <div class="ring"></div>
      <div class="ring ring2"></div>
      <div class="orb" id="aiOrb">🤖</div>
    </div>

    <!-- Question Card -->
    <div class="q-card">
      <div class="q-num" id="qNum">QUESTION 1 / 3</div>
      <div class="q-text" id="qText">Preparing...</div>
      <div class="status-badge badge-idle" id="statusBadge">⏳ Getting ready...</div>
    </div>

    <!-- Transcript -->
    <div class="transcript-box" id="transcript">Your spoken answer will appear here...</div>

    <!-- Mic Button -->
    <div style="text-align:center">
      <button class="mic-btn" id="micBtn" disabled>🎤</button>
      <div class="mic-label" id="micLabel">Wait for question...</div>
    </div>

  </div>
</div>

<!-- SCREEN 3: Result -->
<div class="screen" id="s-result">
  <div class="result-card">
    <div class="result-icon" id="rIcon"></div>
    <h2 id="rTitle"></h2>
    <p class="score-text" id="rScore"></p>
    <div class="q-results" id="rDetails"></div>
    <button id="rBtn" style="width:100%"></button>
  </div>
</div>

<script>
// ═════════════════════════════════════════════════
// ✅ CONFIGURATION — Edit questions below freely
// ═════════════════════════════════════════════════
const EXAM_URL   = "http://localhost:8080";  // ← change to your exam URL
const PASS_MARK  = 2;                         // correct answers needed out of total
const AI_VOICE_LANG = "en-US";               // AI speech language

const QUESTIONS = [
  {
    speak : "Question 1. What is the time complexity of Binary Search?",
    display: "What is the time complexity of Binary Search?",
    keywords: ["log n","o log n","logarithmic","log"],
    explanation: "Binary Search has O log n time complexity, as it halves the search space each step."
  },
  {
    speak : "Question 2. What does OOP stand for? Name one of its core principles.",
    display: "What does OOP stand for? Name one of its principles.",
    keywords: ["object oriented","encapsulation","inheritance","polymorphism","abstraction"],
    explanation: "OOP stands for Object Oriented Programming. Its principles are encapsulation, inheritance, polymorphism, and abstraction."
  },
  {
    speak : "Question 3. What is a primary key in a database?",
    display: "What is a Primary Key in a database?",
    keywords: ["unique","uniquely","identifier","identify","not null","primary"],
    explanation: "A primary key uniquely identifies each row in a table. It must be unique and cannot be null."
  }
];

// ═════════════════════════════════════════════════
// STATE
// ═════════════════════════════════════════════════
let candidateName = "";
let currentQ = 0;
let scores = [];
let recognition = null;
let isListening = false;

// ═════════════════════════════════════════════════
// UTILS
// ═════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setOrb(state) {
  const orb = document.getElementById('aiOrb');
  orb.className = 'orb';
  if (state === 'speaking') orb.classList.add('speaking');
  if (state === 'listening') orb.classList.add('listening');
}

function setStatus(text, type) {
  const b = document.getElementById('statusBadge');
  b.textContent = text;
  b.className = 'status-badge badge-' + (type || 'idle');
}

function setTranscript(text, active) {
  const t = document.getElementById('transcript');
  t.textContent = text || 'Your spoken answer will appear here...';
  t.className = 'transcript-box' + (active && text ? ' has-text' : '');
}

function setMic(enabled, active) {
  const btn = document.getElementById('micBtn');
  const lbl = document.getElementById('micLabel');
  btn.disabled = !enabled;
  btn.className = 'mic-btn' + (active ? ' active' : '');
  lbl.textContent = active ? '🔴 Listening... click to stop' : (enabled ? 'Click mic to answer' : 'Wait for question...');
}

function updateProgress(qIdx) {
  const pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Question ${qIdx + 1} of ${QUESTIONS.length}`;
  document.getElementById('qNum').textContent = `QUESTION ${qIdx + 1} / ${QUESTIONS.length}`;
}

// ═════════════════════════════════════════════════
// SPEECH SYNTHESIS (AI speaks)
// ═════════════════════════════════════════════════
function aiSpeak(text) {
  return new Promise(resolve => {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = AI_VOICE_LANG;
    utt.rate  = 0.92;
    utt.pitch = 1.05;
    utt.volume = 1;
    // pick a good voice if available
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Neural'))
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utt.voice = preferred;
    utt.onstart = () => setOrb('speaking');
    utt.onend   = () => { setOrb('idle'); resolve(); };
    utt.onerror = () => { setOrb('idle'); resolve(); };
    window.speechSynthesis.speak(utt);
  });
}

// ═════════════════════════════════════════════════
// SPEECH RECOGNITION (candidate speaks)
// ═════════════════════════════════════════════════
function listenForAnswer() {
  return new Promise((resolve) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert('Your browser does not support Speech Recognition. Please use Google Chrome.');
      resolve('');
      return;
    }
    recognition = new SR();
    recognition.lang = AI_VOICE_LANG;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    isListening = true;
    setMic(true, true);
    setOrb('listening');
    setStatus('🔴 Listening... speak now', 'listening');

    let finalTranscript = '';
    let interimTranscript = '';

    recognition.onresult = (e) => {
      interimTranscript = '';
      finalTranscript   = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalTranscript += t;
        else interimTranscript += t;
      }
      setTranscript((finalTranscript || interimTranscript), true);
    };

    recognition.onend = () => {
      isListening = false;
      setMic(false, false);
      setOrb('idle');
      resolve(finalTranscript.trim() || interimTranscript.trim());
    };

    recognition.onerror = (e) => {
      isListening = false;
      setMic(false, false);
      setOrb('idle');
      console.warn('Speech recognition error:', e.error);
      resolve(finalTranscript.trim() || '');
    };

    recognition.start();
  });
}

function stopListening() {
  if (recognition && isListening) {
    recognition.stop();
    isListening = false;
  }
}

// ═════════════════════════════════════════════════
// EVALUATE
// ═════════════════════════════════════════════════
function evaluate(q, answer) {
  const lower = answer.toLowerCase();
  return q.keywords.some(kw => lower.includes(kw.toLowerCase()));
}

// ═════════════════════════════════════════════════
// MAIN FLOW
// ═════════════════════════════════════════════════
async function runScreening() {
  showScreen('s-voice');
  document.getElementById('nameLabel').textContent = '👤 ' + candidateName;

  // Welcome
  setStatus('💬 AI is speaking...', 'speaking');
  await aiSpeak(`Hello ${candidateName}! Welcome to the XPay AI voice screening. I will ask you ${QUESTIONS.length} questions. Please answer each one by speaking after the microphone activates. Let's begin!`);

  // Loop through questions
  for (let i = 0; i < QUESTIONS.length; i++) {
    currentQ = i;
    updateProgress(i);
    setTranscript('');

    const q = QUESTIONS[i];
    document.getElementById('qText').textContent = q.display;
    setStatus('💬 AI is speaking...', 'speaking');
    setMic(false, false);

    // AI speaks question
    await aiSpeak(q.speak);

    // Small pause
    await new Promise(r => setTimeout(r, 400));

    // Enable mic — wait for candidate
    setStatus('🔴 Your turn — speak your answer!', 'listening');
    setMic(true, false);
    document.getElementById('micBtn').onclick = () => {
      if (isListening) stopListening();
    };

    // Listen
    const answer = await listenForAnswer();
    const heard  = answer || '(no answer heard)';
    setTranscript(heard, !!answer);
    setMic(false, false);

    // Evaluate
    const correct = answer ? evaluate(q, answer) : false;
    scores.push({ correct, heard });

    // AI feedback
    setStatus(correct ? '✅ Correct!' : '❌ Incorrect', correct ? 'correct' : 'wrong');
    if (correct) {
      await aiSpeak(`Correct! ${q.explanation}`);
    } else {
      await aiSpeak(`Not quite. ${q.explanation}`);
    }

    await new Promise(r => setTimeout(r, 300));
  }

  // Final result
  const total  = scores.filter(s => s.correct).length;
  const passed = total >= PASS_MARK;

  document.getElementById('progressBar').style.width = '100%';
  setStatus('📊 Screening complete', 'thinking');

  if (passed) {
    await aiSpeak(`Congratulations ${candidateName}! You scored ${total} out of ${QUESTIONS.length} and have qualified for the exam. You may now proceed.`);
  } else {
    await aiSpeak(`Sorry ${candidateName}. You scored ${total} out of ${QUESTIONS.length}. You need at least ${PASS_MARK} correct answers to qualify. Please try again.`);
  }

  showResult(passed, total);
}

// ═════════════════════════════════════════════════
// SHOW RESULT
// ═════════════════════════════════════════════════
function showResult(passed, total) {
  showScreen('s-result');
  document.getElementById('rIcon').textContent  = passed ? '🎉' : '😔';
  document.getElementById('rTitle').textContent = passed ? 'You Qualified!' : 'Not Qualified';
  document.getElementById('rTitle').className   = passed ? 'pass-title' : 'fail-title';
  document.getElementById('rScore').innerHTML   = `You scored <strong>${total} / ${QUESTIONS.length}</strong> &nbsp;|&nbsp; Pass mark: ${PASS_MARK}`;

  const details = document.getElementById('rDetails');
  details.innerHTML = '';
  scores.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'q-result-row ' + (s.correct ? 'ok' : 'bad');
    row.innerHTML = `
      <span style="font-size:18px">${s.correct ? '✅' : '❌'}</span>
      <div>
        <div>${QUESTIONS[i].display}</div>
        <div class="heard">You said: "${s.heard}"</div>
      </div>`;
    details.appendChild(row);
  });

  const btn = document.getElementById('rBtn');
  if (passed) {
    btn.textContent = 'Proceed to Exam →';
    btn.className   = 'btn-green';
    btn.onclick     = () => window.location.href = EXAM_URL;
  } else {
    btn.textContent = '🔄 Try Again';
    btn.className   = 'btn-retry';
    btn.onclick     = () => location.reload();
  }
}

// ═════════════════════════════════════════════════
// EVENTS
// ═════════════════════════════════════════════════
const nameField = document.getElementById('nameField');
const startBtn  = document.getElementById('startBtn');

nameField.addEventListener('input', () => {
  startBtn.disabled = nameField.value.trim() === '';
});

startBtn.addEventListener('click', () => {
  const name = nameField.value.trim();
  if (!name) return;
  candidateName = name;
  // preload voices
  window.speechSynthesis.getVoices();
  runScreening();
});

// toggle mic manually
document.getElementById('micBtn').addEventListener('click', () => {
  if (isListening) stopListening();
});

// preload voices on page load
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
