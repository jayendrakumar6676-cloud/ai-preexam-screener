<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pre-Exam Screener</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Name Screen */
    .name-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; width:100%; }
    .name-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .ai-avatar { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 32px; }
    .name-form { display: flex; flex-direction: column; gap: 14px; }
    .name-input {
      padding: 14px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff; font-size: 15px; outline: none;
    }
    .name-input::placeholder { color: rgba(255,255,255,0.35); }
    .name-input:focus { border-color: #818cf8; }
    .start-btn {
      padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .start-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Chat Screen */
    .chat-screen { display:none; flex-direction:column; height:100vh; max-width:720px; width:100%; margin:0 auto; padding:0 16px; }
    .chat-header {
      display:flex; align-items:center; gap:10px;
      padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.1);
      color:#fff; font-size:14px; font-weight:600; flex-shrink:0;
    }
    .ai-dot {
      width:10px; height:10px; border-radius:50%; background:#22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .chat-header-title { flex:1; color:rgba(255,255,255,0.9); }
    .candidate-label { color:rgba(255,255,255,0.5); font-size:13px; }
    .chat-body {
      flex:1; overflow-y:auto; padding:20px 0;
      display:flex; flex-direction:column; gap:12px;
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent;
    }
    .ai-bubble-wrap { display:flex; align-items:flex-end; gap:10px; }
    .ai-icon { font-size:22px; flex-shrink:0; margin-bottom:4px; }
    .ai-bubble {
      background:rgba(99,102,241,0.25); border:1px solid rgba(99,102,241,0.4);
      color:#e2e8f0; padding:12px 16px;
      border-radius:18px 18px 18px 4px;
      font-size:14px; line-height:1.6; max-width:80%;
      animation: fadeIn 0.3s ease;
    }
    .user-bubble-wrap { display:flex; justify-content:flex-end; }
    .user-bubble {
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff; padding:12px 16px;
      border-radius:18px 18px 4px 18px;
      font-size:14px; line-height:1.6; max-width:75%;
      animation: fadeIn 0.3s ease;
    }
    .typing-bubble {
      background:rgba(99,102,241,0.25); border:1px solid rgba(99,102,241,0.4);
      padding:14px 18px; border-radius:18px 18px 18px 4px;
      display:flex; gap:5px; align-items:center;
    }
    .dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(255,255,255,0.5);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2){animation-delay:0.2s}
    .dot:nth-child(3){animation-delay:0.4s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .chat-input-form {
      display:flex; gap:10px; padding:16px 0 24px;
      flex-shrink:0; border-top:1px solid rgba(255,255,255,0.1);
    }
    .input-box {
      flex:1; padding:13px 18px; border-radius:12px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.07);
      color:#fff; font-size:14px; outline:none;
    }
    .input-box::placeholder{color:rgba(255,255,255,0.3)}
    .input-box:focus:not(:disabled){border-color:#818cf8}
    .input-box:disabled{opacity:0.4;cursor:not-allowed}
    .send-btn {
      padding:13px 20px; border-radius:12px; border:none;
      background:linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff; font-weight:600; font-size:14px; cursor:pointer;
      transition:opacity 0.2s; white-space:nowrap;
    }
    .send-btn:hover:not(:disabled){opacity:0.85}
    .send-btn:disabled{opacity:0.35;cursor:not-allowed}

    /* Result Screen */
    .result-screen { display:none; align-items:center; justify-content:center; min-height:100vh; padding:24px; width:100%; }
    .result-card {
      background:rgba(255,255,255,0.06); backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.12); border-radius:24px;
      padding:48px 40px; max-width:500px; width:100%;
      text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.4);
    }
    .result-icon{font-size:64px;margin-bottom:16px}
    .pass-title{font-size:28px;font-weight:700;color:#22c55e;margin-bottom:8px}
    .fail-title{font-size:28px;font-weight:700;color:#ef4444;margin-bottom:8px}
    .score-text{font-size:16px;color:rgba(255,255,255,0.7);margin-bottom:24px}
    .answer-summary{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;text-align:left}
    .answer-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;color:rgba(255,255,255,0.85)}
    .correct{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3)}
    .wrong{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3)}
    .proceed-btn {
      width:100%;padding:15px;border-radius:12px;border:none;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;font-size:15px;font-weight:700;cursor:pointer;
      transition:opacity 0.2s,transform 0.2s;
    }
    .proceed-btn:hover{opacity:0.9;transform:translateY(-1px)}
    .retry-btn {
      width:100%;padding:15px;border-radius:12px;
      border:1px solid rgba(255,255,255,0.2);
      background:rgba(255,255,255,0.07);
      color:#fff;font-size:15px;font-weight:600;cursor:pointer;
      transition:opacity 0.2s;
    }
    .retry-btn:hover{opacity:0.75}
  </style>
</head>
<body>

<!-- SCREEN 1: Enter Name -->
<div class="name-screen" id="nameScreen">
  <div class="name-card">
    <div class="ai-avatar">🤖</div>
    <h1 class="title">AI Pre-Exam Screener</h1>
    <p class="subtitle">Answer 3 questions to qualify for the exam</p>
    <form class="name-form" id="nameForm">
      <input class="name-input" id="nameInput" placeholder="Enter your full name..." autocomplete="off" />
      <button type="submit" class="start-btn" id="startBtn" disabled>Start Screening →</button>
    </form>
  </div>
</div>

<!-- SCREEN 2: Chat -->
<div class="chat-screen" id="chatScreen">
  <div class="chat-header">
    <span class="ai-dot"></span>
    <span class="chat-header-title" id="chatTitle">🤖 XPay AI — Screening 1/3</span>
    <span class="candidate-label" id="candidateLabel"></span>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <form class="chat-input-form" id="chatForm">
    <input class="input-box" id="inputBox" placeholder="Type your answer here..." autocomplete="off" />
    <button type="submit" class="send-btn" id="sendBtn" disabled>Send ➤</button>
  </form>
</div>

<!-- SCREEN 3: Result -->
<div class="result-screen" id="resultScreen">
  <div class="result-card">
    <div class="result-icon" id="resultIcon"></div>
    <h2 id="resultTitle"></h2>
    <p class="score-text" id="scoreText"></p>
    <div class="answer-summary" id="answerSummary"></div>
    <button id="resultBtn" style="width:100%"></button>
  </div>
</div>

<script>
// ────────────────────────────────
// QUESTIONS — Edit these freely!
// ────────────────────────────────
const QUESTIONS = [
  {
    question: "What is the time complexity of Binary Search?",
    keywords: ["o(log n)","log n","logarithmic","log"],
    explanation: "Binary Search has O(log n) time complexity as it halves the search space each step."
  },
  {
    question: "What does OOP stand for? Name one of its core principles.",
    keywords: ["object oriented","object-oriented","encapsulation","inheritance","polymorphism","abstraction","oop"],
    explanation: "OOP = Object-Oriented Programming. Core principles: Encapsulation, Inheritance, Polymorphism, Abstraction."
  },
  {
    question: "What is a Primary Key in a database?",
    keywords: ["unique","uniquely identify","identifier","primary","not null"],
    explanation: "A Primary Key uniquely identifies each row in a table. It must be unique and not null."
  }
];

const PASS_MARK = 2; // out of 3
const EXAM_URL  = "http://localhost:8080"; // ← change to your exam URL

// ────────────────────────────────
// STATE
// ────────────────────────────────
let candidateName = "";
let currentQ      = 0;
let scores        = [];
let inputLocked   = true;

// ────────────────────────────────
// HELPERS
// ────────────────────────────────
function show(id)   { document.getElementById(id).style.display = 'flex'; }
function hide(id)   { document.getElementById(id).style.display = 'none'; }
function scrollBottom() {
  const body = document.getElementById('chatBody');
  setTimeout(() => body.scrollTop = body.scrollHeight, 50);
}

function addAiBubble(text) {
  const body = document.getElementById('chatBody');
  const wrap = document.createElement('div');
  wrap.className = 'ai-bubble-wrap';
  wrap.innerHTML = `<div class="ai-icon">🤖</div><div class="ai-bubble">${text}</div>`;
  body.appendChild(wrap);
  scrollBottom();
}

function addUserBubble(text) {
  const body = document.getElementById('chatBody');
  const wrap = document.createElement('div');
  wrap.className = 'user-bubble-wrap';
  wrap.innerHTML = `<div class="user-bubble">${text}</div>`;
  body.appendChild(wrap);
  scrollBottom();
}

function showTyping() {
  const body = document.getElementById('chatBody');
  const wrap = document.createElement('div');
  wrap.className = 'ai-bubble-wrap'; wrap.id = 'typingIndicator';
  wrap.innerHTML = `<div class="ai-icon">🤖</div><div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  body.appendChild(wrap);
  scrollBottom();
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function aiSay(text, delay) {
  return new Promise(resolve => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addAiBubble(text);
      resolve();
    }, delay || 1200);
  });
}

function lockInput(placeholder) {
  inputLocked = true;
  const box = document.getElementById('inputBox');
  const btn = document.getElementById('sendBtn');
  box.disabled = true;
  btn.disabled = true;
  box.placeholder = placeholder || 'AI is thinking...';
}

function unlockInput() {
  inputLocked = false;
  const box = document.getElementById('inputBox');
  const btn = document.getElementById('sendBtn');
  box.disabled = false;
  box.placeholder = 'Type your answer here...';
  box.value = '';
  box.focus();
  updateSendBtn();
}

function updateSendBtn() {
  const box = document.getElementById('inputBox');
  const btn = document.getElementById('sendBtn');
  btn.disabled = inputLocked || box.value.trim() === '';
}

function checkAnswer(q, answer) {
  const lower = answer.toLowerCase().trim();
  return q.keywords.some(kw => lower.includes(kw.toLowerCase()));
}

function updateChatTitle() {
  document.getElementById('chatTitle').textContent =
    `🤖 XPay AI — Screening ${Math.min(currentQ+1, QUESTIONS.length)}/${QUESTIONS.length}`;
}

// ────────────────────────────────
// START CHAT
// ────────────────────────────────
async function startChat(name) {
  hide('nameScreen');
  show('chatScreen');
  document.getElementById('candidateLabel').textContent = '👤 ' + name;
  lockInput();
  await aiSay(`👋 Hello ${name}! I'm XPay AI, your screening assistant.`, 800);
  await aiSay(`I'll ask you ${QUESTIONS.length} quick technical questions. Answer correctly to qualify for the exam.`, 1400);
  await aiSay(`Let's begin! Here's Question 1 of ${QUESTIONS.length}:`, 900);
  await aiSay(`❓ ${QUESTIONS[0].question}`, 1100);
  unlockInput();
}

// ────────────────────────────────
// HANDLE ANSWER
// ────────────────────────────────
async function handleAnswer(answer) {
  addUserBubble(answer);
  lockInput();

  const q = QUESTIONS[currentQ];
  const correct = checkAnswer(q, answer);
  scores.push({ correct, answer });

  if (correct) {
    await aiSay(`✅ Correct! ${q.explanation}`, 1200);
  } else {
    await aiSay(`❌ Not quite. ${q.explanation}`, 1200);
  }

  currentQ++;
  updateChatTitle();

  if (currentQ < QUESTIONS.length) {
    await aiSay(`Question ${currentQ + 1} of ${QUESTIONS.length}:`, 800);
    await aiSay(`❓ ${QUESTIONS[currentQ].question}`, 1100);
    unlockInput();
  } else {
    // All done
    const totalCorrect = scores.filter(s => s.correct).length;
    const passed = totalCorrect >= PASS_MARK;
    await aiSay(`📊 Screening complete! You got ${totalCorrect} out of ${QUESTIONS.length} correct.`, 1200);
    if (passed) {
      await aiSay(`🎉 Congratulations ${candidateName}! You qualified. Redirecting to exam...`, 1300);
    } else {
      await aiSay(`😔 Sorry ${candidateName}, you need at least ${PASS_MARK} correct to qualify. You scored ${totalCorrect}/${QUESTIONS.length}.`, 1400);
    }
    setTimeout(() => showResult(passed, totalCorrect), 1800);
  }
}

// ────────────────────────────────
// SHOW RESULT
// ────────────────────────────────
function showResult(passed, totalCorrect) {
  hide('chatScreen');
  show('resultScreen');

  document.getElementById('resultIcon').textContent  = passed ? '🎉' : '😔';
  document.getElementById('resultTitle').textContent = passed ? 'You Qualified!' : 'Not Qualified';
  document.getElementById('resultTitle').className   = passed ? 'pass-title' : 'fail-title';
  document.getElementById('scoreText').innerHTML = `Score: <strong>${totalCorrect} / ${QUESTIONS.length}</strong>`;

  const summary = document.getElementById('answerSummary');
  summary.innerHTML = '';
  scores.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'answer-row ' + (s.correct ? 'correct' : 'wrong');
    row.innerHTML = `<span>${s.correct ? '✅' : '❌'}</span><span>Q${i+1}: ${QUESTIONS[i].question.slice(0,55)}...</span>`;
    summary.appendChild(row);
  });

  const btn = document.getElementById('resultBtn');
  if (passed) {
    btn.textContent = 'Proceed to Exam →';
    btn.className   = 'proceed-btn';
    btn.onclick     = () => window.location.href = EXAM_URL;
  } else {
    btn.textContent = 'Try Again';
    btn.className   = 'retry-btn';
    btn.onclick     = () => location.reload();
  }
}

// ────────────────────────────────
// EVENT LISTENERS
// ────────────────────────────────
const nameInput = document.getElementById('nameInput');
const startBtn  = document.getElementById('startBtn');
nameInput.addEventListener('input', () => {
  startBtn.disabled = nameInput.value.trim() === '';
});
document.getElementById('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) return;
  candidateName = name;
  startChat(name);
});

document.getElementById('inputBox').addEventListener('input', updateSendBtn);
document.getElementById('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const val = document.getElementById('inputBox').value.trim();
  if (!val || inputLocked) return;
  handleAnswer(val);
});
</script>
</body>
</html>
